<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRIS · База логистики</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#172e43;font:15px system-ui}header{background:#142e43;color:white;padding:22px 4%;display:flex;align-items:center;gap:25px}header a{color:white}main{margin:25px auto;max-width:1400px;padding:0 24px}button,input,select,textarea{font:inherit;padding:9px;border:1px solid #cbd7df;border-radius:6px}button{cursor:pointer;background:#167b85;color:white}nav,.filters{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.panel{background:white;border:1px solid #e0e7ec;border-radius:10px;padding:20px;margin:12px 0}table{border-collapse:collapse;width:100%;font-size:13px}td,th{text-align:left;border-bottom:1px solid #e0e7ec;padding:10px;vertical-align:top}.table{overflow:auto}small,.muted{color:#687d8e}label{display:block;margin:12px 0}label input,label textarea,label select{display:block;width:100%;margin-top:5px}textarea{min-height:100px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}.badge{display:inline-block;padding:4px 7px;background:#edf3f6;border-radius:4px;margin:3px}dialog{width:min(1000px,95%);max-height:90vh;border:0;border-radius:12px;overflow:auto}a{color:#167b85}#message{padding:10px}h2{margin-top:0}.component{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr auto;gap:5px;margin:8px 0}.component input,.component select{width:100%}@media(max-width:700px){.component{grid-template-columns:1fr 1fr}header{flex-wrap:wrap}}
</style></head><body><header><strong>BRIS · База логистики</strong><a href="/">Калькулятор</a><span id="counts"></span></header><main><p>Справочник для внутренней работы. Ставки сохраняются с источником, датами, оборудованием и составом услуг. Цена из документа требует проверки доступности перевозки.</p><nav><button onclick="view('providers')">Поставщики</button><button onclick="view('routes')">Маршруты</button><button onclick="view('offers')">Ставки и сравнение</button><button onclick="view('bookings')">Фактические перевозки</button><button onclick="view('marine')">Total морской ставки</button><button onclick="view('sources')">Реестр документов</button><button onclick="exportData()">Экспорт базы JSON</button></nav><div id="message" role="status"></div><div class="filters"><input id="search" placeholder="Поставщик, порт, станция…" oninput="render()"><select id="mode" onchange="render()"><option value="">Все виды</option><option value="sea">Море</option><option value="sea_rail">Море + ЖД</option><option value="direct_rail">Прямой ЖД без моря</option><option value="rail">ЖД по России</option><option value="rail_sea">ЖД + море</option></select><input type="date" id="date" value="2026-09-30" onchange="render()"><select id="period" onchange="render()"><option value="all">Все даты</option><option value="active">По сроку действия</option><option value="future">Будущие</option><option value="archive">Истёкшие</option><option value="unknown">Без установленного срока</option></select></div><div id="content"></div></main><dialog id="editor"><div id="form"></div></dialog><script>
let db,tab=location.hash==='#offers'?'offers':'providers',editing=null;const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),modes={sea:'Море',rail:'ЖД',sea_rail:'Море + ЖД',direct_rail:'Прямой ЖД без моря',rail_sea:'ЖД + море'};
async function api(method,data){const r=await fetch('/api/catalog',{method,headers:{'X-BRIS-Token':document.querySelector('meta[name=bris-token]').content,'Content-Type':'application/json'},body:data?JSON.stringify(data):undefined});if(!r.ok)throw Error('Не удалось сохранить. При конфликте версий обновите страницу.');return r.json()}
async function init(){try{db=await api('GET');render()}catch(e){$('message').textContent=e.message}}function view(t){tab=t;render()}function provider(id){return db.providers.find(p=>p.id===id)?.name||id}function status(o){const d=$('date').value;if(!o.valid_from)return'unknown';if(o.valid_from>d)return'future';if(o.valid_to&&o.valid_to<d)return'archive';return'active'}const statuses={active:'По сроку действует; подтвердить',future:'Будущая',archive:'Истёкшая',unknown:'Срок не установлен'};
function safeLink(url,title){try{const u=new URL(url);return['http:','https:'].includes(u.protocol)?`<a target="_blank" rel="noopener noreferrer" href="${esc(u.href)}">${esc(title)}</a>`:esc(title)}catch{return esc(title)}}function sourceLink(id){let s=db.sources.find(s=>s.id===id);return s?safeLink(s.url,s.title):'Источник нужно уточнить'}
function match(x){return JSON.stringify(x).toLowerCase().includes($('search').value.toLowerCase())}function render(){if(!db)return;$('counts').textContent=`${db.providers.length} поставщика · ${db.offers.length} ставок · ${db.sources.length} документов`;let html='';if(tab==='providers'){html='<button onclick="editProvider()">+ Поставщик</button><div class="grid">'+db.providers.filter(match).map(p=>`<article class="panel"><h2>${esc(p.name)}</h2>${p.services.map(x=>`<span class="badge">${esc(x)}</span>`).join('')}<p>${esc(p.description)}</p>${p.contacts.map(c=>`<p>${esc(c.name)} · ${esc(c.role)}<br>${esc(c.email)}<br>${esc(c.phone)}</p>`).join('')}<p>${safeLink(p.website,'Сайт')}</p><p>${p.links.map(l=>safeLink(l.url,l.title)).join('<br>')}</p><small>${p.sources.map(sourceLink).join('<br>')}</small><p><button onclick="editProvider('${esc(p.id)}')">Редактировать карточку</button></p></article>`).join('')+'</div>'}
if(tab==='routes'){html=db.routes.filter(match).filter(r=>!$('mode').value||r.mode===$('mode').value).map(r=>`<article class="panel"><h2>${esc(r.name)}</h2><span class="badge">${esc(modes[r.mode])}</span><p>${r.nodes.map(esc).join(' → ')}</p><small>${esc(r.verification)}<br>${r.sources.map(sourceLink).join('<br>')}</small></article>`).join('')+'<p>Для прямого ЖД запросить: станцию отправления, переход, транзитные страны, станцию назначения, COC/SOC, вес, локальные сборы, срок и доступность оборудования. Порт и морской фрахт не требуются.</p>'}
if(tab==='bookings'){html='<p>Ставки из журнала пользователя. Не являются котировкой на сегодня. Пустое поле не означает ноль; валюта THC/WR и база начисления требуют проверки по счёту.</p><div class="table"><table><tr><th>Строка / отправитель</th><th>Линия / контейнеры</th><th>ETD / ETA</th><th>Ставки из журнала</th><th>Статус / подтверждение</th></tr>'+(db.bookings||[]).filter(match).map(b=>`<tr><td>${esc(b.source_row_label)} · ${esc(b.shipper)}</td><td>${esc(b.provider_name)}<br>${esc(b.container_count_raw)}</td><td>${esc(b.etd_raw)}<br>${esc(b.eta_raw)}</td><td>Фрахт: ${esc(b.freight_rate_raw||'не указан')}<br>THC: ${esc(b.thc_rate_raw||'не указан')}<br>WR: ${esc(b.war_risk_raw||'не указан')}<br>Итого фрахт: ${esc(b.freight_total_raw||'?')}<br>Итого THC: ${esc(b.thc_total_raw||'?')}</td><td>${esc(b.status)}<br>${esc(b.bill_of_lading_raw)}<br>${esc(b.reference_raw)}<br>${sourceLink(b.source_id)}</td></tr>`).join('')+'</table></div>'}
if(tab==='marine'){html=`<section class="panel"><h2>Total международной морской перевозки, USD</h2><p>Фрахт, DTHC/DTNS, WR, портовое экспедирование, коносамент и сдача контейнера — отдельные статьи. Если сбор уже включён во фрахт, не добавляйте его второй раз.</p><div class="grid">${field('mqty','Контейнеров',1,'number')}${field('mbl','Коносаментов',1,'number')}${field('mfx','RUB за 1 USD (дата курса ниже)',80,'number')}${field('mdate','Дата курса',$('date').value,'date')}${field('mfreight','Фрахт, USD / контейнер',0,'number')}${field('mdthc','DTHC/DTNS, USD / контейнер',0,'number')}${field('mwr','WR, USD / контейнер',0,'number')}${field('mexp','Экспедирование, RUB / контейнер (часто 5000)',0,'number')}${field('mdoc','Коносамент, RUB / документ (часто 6500)',0,'number')}${field('mdrop','Сдача при смене порта, USD / контейнер (уточнить 200–500)',0,'number')}${field('mpct','Конвертация, %',3,'number')}<label>База 3%<select id="mbase"><option value="freight">Только фрахт</option><option value="all">Фрахт + DTHC + WR + сдача</option><option value="manual">Указать базу USD вручную</option></select></label>${field('mmanual','Ручная база комиссии, USD на всю отправку',0,'number')}</div><p>НДС каждой статьи нужно привести к выбранной базе перед вводом. Курс 80 — пример, замените фактическим. Для сборов в EUR/CNY сначала пересчитайте их в USD по курсу выбранной даты.</p><button onclick="marineTotal()">Рассчитать Total</button><div id="mtotal"></div><p>Это стоимость морской услуги без нашей наценки, пошлины, таможенного НДС и последующих ЖД/авто плеч.</p></section>`}
if(tab==='sources'){html='<div class="table"><table><tr><th>Документ</th><th>Обработка</th><th>Объём текста</th></tr>'+db.sources.filter(match).map(s=>`<tr><td>${sourceLink(s.id)}<br><small>${esc(s.path)}</small></td><td>${s.status==='text_extracted_requires_validation'?'Текст извлечён; проверка содержания не завершена':'Нужна ручная проверка / распознавание'}</td><td>${s.text_characters}</td></tr>`).join('')+'</table></div>'}
if(tab==='offers'){let rows=db.offers.filter(o=>match({...o,provider:provider(o.provider_id)})).filter(o=>!$('mode').value||o.mode===$('mode').value).filter(o=>$('period').value==='all'||status(o)===$('period').value);html='<button onclick="editOffer()">+ Предложение / состав ставки</button><p>Сравнивайте одинаковые направления, типы контейнера, вес и состав услуг. Итоги ниже — по валютам документа; НДС и исключения ещё не приведены к единой базе.</p><div class="table"><table><tr><th>Поставщик / маршрут</th><th>Контейнер / вес</th><th>Даты</th><th>Состав и итоги</th><th>Условия / источник</th></tr>'+rows.map(o=>{const totals={};for(const c of o.components)if(!c.included&&!c.optional)totals[c.currency+' / '+c.unit]=(totals[c.currency+' / '+c.unit]||0)+Number(c.amount);return`<tr><td>${esc(provider(o.provider_id))}${o.booking_id?'<br>Фактический букинг: '+esc(o.booking_id)+' от '+esc(o.booked_on):''}<br>${esc(o.origin)} → ${esc(o.destination)}<br>${esc(modes[o.mode])}</td><td>${esc(o.equipment)} ${esc(o.ownership)}<br>${o.weight_min_exclusive?'>'+o.weight_min_exclusive+'т; ':''}${o.weight_max?'≤'+o.weight_max+'т':'Вес уточнить'}</td><td>${esc(o.valid_from||'?')} — ${esc(o.valid_to||'не указан')}<br>${esc(statuses[status(o)])}</td><td>${o.components.map(c=>`${esc(c.name)}: ${esc(c.amount)} ${esc(c.currency)} / ${esc(c.unit)}; ${esc(c.vat)}${c.included?' (включено)':''}`).join('<br>')}<p><strong>${Object.entries(totals).map(([k,v])=>esc(v+' '+k)).join(' + ')}</strong></p><button onclick="editOffer('${o.id}')">Открыть / изменить</button></td><td>${esc(o.conditions)}<br><small>${sourceLink(o.source_id)}</small></td></tr>`}).join('')+'</table></div>'} $('content').innerHTML=html}
function field(id,label,value='',type='text'){return`<label>${label}<input id="${id}" type="${type}" value="${esc(value)}"></label>`}function area(id,label,value){return`<label>${label}<textarea id="${id}">${esc(value)}</textarea></label>`}
function editProvider(id){const p=db.providers.find(p=>p.id===id)||{id:'supplier-'+crypto.randomUUID(),name:'',services:[],contacts:[],links:[],sources:[]};editing=structuredClone(p);$('form').innerHTML='<h2>Карточка поставщика</h2>'+field('pname','Компания',p.name)+field('pinn','ИНН',p.inn)+field('pservices','Виды услуг через запятую',p.services.join(', '))+field('psite','Сайт',p.website)+area('pdescription','Описание компании',p.description||'')+area('pknown','Известные ставки и маршруты (описание)',p.known_rates_routes||'')+area('pcontacts','Сотрудники: имя | должность | email | телефон, каждый с новой строки',p.contacts.map(c=>[c.name,c.role,c.email,c.phone].join(' | ')).join('\n'))+area('plinks','Полезные ссылки и облака: название | URL, каждая с новой строки',p.links.map(l=>[l.title,l.url].join(' | ')).join('\n'))+'<button onclick="saveProvider()">Сохранить в базе</button> <button onclick="$(\'editor\').close()">Отмена</button>';$('editor').showModal()}
async function persist(){try{const r=await api('POST',db);db.revision=r.revision;$('editor').close();$('message').textContent='Сохранено в SQLite. Предыдущая версия справочника сохранена.';render()}catch(e){$('message').textContent=e.message}}
function saveProvider(){const p=editing;p.name=$('pname').value.trim();if(!p.name)return alert('Введите компанию');p.inn=$('pinn').value;p.services=$('pservices').value.split(',').map(x=>x.trim()).filter(Boolean);p.website=$('psite').value;p.description=$('pdescription').value;p.known_rates_routes=$('pknown').value;p.contacts=$('pcontacts').value.split('\n').filter(x=>x.trim()).map(x=>{let[name,role,email,phone]=x.split('|').map(x=>x.trim());return{name,role,email,phone}});p.links=$('plinks').value.split('\n').filter(x=>x.trim()).map(x=>{let[title,url]=x.split('|').map(x=>x.trim());return{title,url}});let i=db.providers.findIndex(x=>x.id===p.id);if(i<0)db.providers.push(p);else db.providers[i]=p;persist()}
function component(c={}){return`<div class="component" data-flags="${esc(JSON.stringify({included:c.included||false,optional:c.optional||false}))}"><input placeholder="Статья" value="${esc(c.name)}"><input type="number" min="0" step="0.01" placeholder="Сумма" value="${esc(c.amount)}"><input placeholder="Валюта" value="${esc(c.currency||'USD')}"><input placeholder="Единица" value="${esc(c.unit||'container')}"><input placeholder="НДС / включение" value="${esc(c.vat||'Уточнить')}"><button onclick="this.parentElement.remove()">×</button></div>`}
function editOffer(id){editing=structuredClone(db.offers.find(o=>o.id===id)||{id:'offer-'+crypto.randomUUID(),components:[],mode:'direct_rail',ownership:'COC'});const o=editing;$('form').innerHTML='<h2>Предложение поставщика</h2><label>Поставщик<select id="oprovider">'+db.providers.map(p=>`<option value="${esc(p.id)}" ${p.id===o.provider_id?'selected':''}>${esc(p.name)}</option>`).join('')+'</select></label><label>Вид перевозки<select id="omode">'+Object.entries(modes).map(([id,title])=>`<option value="${id}" ${id===o.mode?'selected':''}>${title}</option>`).join('')+'</select></label><div class="grid">'+field('oorigin','Откуда (порт или станция)',o.origin)+field('odest','Куда (порт или станция)',o.destination)+field('oequipment','Тип контейнера',o.equipment)+field('oownership','COC / SOC',o.ownership)+field('owmin','Вес более, тонн',o.weight_min_exclusive,'number')+field('owmax','Максимальный вес, тонн',o.weight_max,'number')+field('ofrom','Действует с',o.valid_from,'date')+field('oto','Действует до',o.valid_to,'date')+'</div>'+area('ocond','Условия, включено / не включено, курс перевозчика',o.conditions||'')+field('osource','ID документа из реестра',o.source_id)+field('obooking','Номер фактического букинга (если есть)',o.booking_id)+field('obooked','Дата букинга',o.booked_on,'date')+field('oevidence','Ссылка на подтверждение букинга / счёт',o.evidence_url)+'<p>Строки: статья · сумма · валюта · единица · НДС. Количества рассчитываются отдельно: контейнер, TEU, документ, тонна/сутки не взаимозаменяемы.</p><div id="components">'+o.components.map(component).join('')+'</div><button onclick="$(\'components\').insertAdjacentHTML(\'beforeend\',component())">+ Статья</button><p><button onclick="saveOffer()">Сохранить предложение</button> <button onclick="$(\'editor\').close()">Отмена</button></p>';$('editor').showModal()}
function saveOffer(){const o=editing;for(const[k,id]of Object.entries({provider_id:'oprovider',origin:'oorigin',destination:'odest',mode:'omode',equipment:'oequipment',ownership:'oownership',valid_from:'ofrom',valid_to:'oto',source_id:'osource',conditions:'ocond',booking_id:'obooking',booked_on:'obooked',evidence_url:'oevidence'}))o[k]=$(id).value||null;o.weight_min_exclusive=$('owmin').value?Number($('owmin').value):null;o.weight_max=$('owmax').value?Number($('owmax').value):null;o.components=[...$('components').children].map((row,i)=>{const a=[...row.querySelectorAll('input')].map(x=>x.value);return{...JSON.parse(row.dataset.flags),name:a[0],amount:Number(a[1]),currency:a[2].toUpperCase(),unit:a[3],vat:a[4]}});if(!o.origin||!o.destination||!o.components.length||o.components.some(c=>!c.name||!Number.isFinite(c.amount)||c.amount<0))return alert('Проверьте направление и статьи');o.verification='user_entered_requires_confirmation';let i=db.offers.findIndex(x=>x.id===o.id);if(i<0)db.offers.push(o);else db.offers[i]=o;persist()}
function marineTotal(){const ids=['mqty','mbl','mfx','mfreight','mdthc','mwr','mexp','mdoc','mdrop','mpct','mmanual'],v={};for(const id of ids){v[id]=Number($(id).value);if(!Number.isFinite(v[id])||v[id]<0)return alert('Проверьте суммы')}if(v.mqty<=0||v.mfx<=0)return alert('Количество и курс должны быть больше нуля');const freight=v.mfreight*v.mqty,foreign=(v.mfreight+v.mdthc+v.mwr+v.mdrop)*v.mqty,local=v.mexp*v.mqty+v.mdoc*v.mbl,base=$('mbase').value==='freight'?freight:$('mbase').value==='all'?foreign:v.mmanual,commission=base*v.mpct/100,total=foreign+commission+local/v.mfx;$('mtotal').textContent=`Валютные статьи: ${foreign.toFixed(2)} USD; рублёвые: ${local.toFixed(2)} RUB = ${(local/v.mfx).toFixed(2)} USD; конвертация: ${commission.toFixed(2)} USD. Total: ${total.toFixed(2)} USD / отправка, ${(total/v.mqty).toFixed(2)} USD / контейнер. Курс от ${$('mdate').value}.`}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='BRIS_Catalog.json';a.click();URL.revokeObjectURL(a.href)}init();
</script></body></html>
